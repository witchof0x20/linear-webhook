[package]
name = "linear-webhook"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
log = "0.4.35"
rocket = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", default-features = false, features = ["model", "rustls_backend"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.8"
zstd = "0.14.4"
